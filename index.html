<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a56db" />
    <meta
      name="description"
      content="Phone-friendly SSC calculation practice for addition, subtraction, multiplication, division, tables, squares and cubes."
    />
    <title>Calculation Practice</title>
    <script>
      try {
        const theme = JSON.parse(localStorage.getItem('ssc-theme') || '"light"')
        document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light'
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
